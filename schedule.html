<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Schedule – EulalieTV</title>
        <link rel="stylesheet" href="css/main.css">
    </head>
    
    <body>
        
        <header class="site-header">
            <a href="index.html" class="logo">EulalieTV</a>
            
            <nav class="main-nav">
                <a href="broadcast.html">Watch</a>
                <a href="shows.html">Shows</a>
                <a href="schedule.html" aria-current="page">Schedule</a>
                <a href="search.html" aria-label="Search">🔍</a>
            </nav>
        </header>
        
        <main class="schedule-page">
            
            <section class="schedule-heading">
                <h1>Schedule</h1>
                <p>See what's airing on EulalieTV.</p>
            </section>
            
            <section class="schedule-date-section">
                
                <div class="schedule-date-header">
                    <button id="previous-day" type="button" aria-label="Previous day">←</button>
                    <h2 id="schedule-date"></h2>
                    <button id="next-day" type="button" aria-label="Next day">→</button>
                </div>
                
                <button id="today-button" type="button">Today</button>
            </section>
            
            <section id="schedule-list" class="schedule-list" aria-label="Broadcast schedule">
                <!-- Schedule entries will be generated by JavaScript. -->
            </section>
            
            <p id="schedule-empty" hidden>
                No scheduled programs are available for this date.
            </p>
        </main>
        <script src="js/app.js"></script>
        <script src="js/data.js"></script>
        <script src="js/schedule.js"></script>
    </body>
    
</html>
